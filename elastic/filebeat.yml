apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: cluster-logs
  namespace: elastic-stack
spec:
  type: filebeat
  version: 9.4.3
  elasticsearchRef:
    name: logs
  config:
    filebeat.inputs:
      - type: filestream
        id: kubernetes-container-logs
        paths:
          - /var/log/containers/*.log
        parsers:
          - container:
              stream: all
        prospector.scanner.symlinks: true
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: /var/log/containers/
    setup.ilm.enabled: true
    setup.ilm.policy_name: kubernetes-logs-2d
    setup.ilm.policy_file: /usr/share/filebeat/ilm/policy.json
    setup.ilm.overwrite: false
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: cluster-logs-filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsUser: 0
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                cpu: 250m
                memory: 300Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
              - name: ilm-policy
                mountPath: /usr/share/filebeat/ilm
                readOnly: true
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          - name: ilm-policy
            configMap:
              name: filebeat-ilm-policy
