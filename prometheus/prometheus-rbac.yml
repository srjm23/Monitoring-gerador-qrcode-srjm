apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-service-discovery
  namespace: qrcode-system
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-service-discovery
  namespace: qrcode-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-service-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: monitoring
